<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630"><rect width="1100" height="630" rx="28" fill="#F7F8F5"/><rect x="34" y="34" width="1032" height="562" rx="24" fill="#EFE8D7"/><text x="92" y="108" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="22" fill="#557266">WISEROBOT STUDIO · 使用指南</text><text x="92" y="185" font-family="Arial, Noto Sans CJK SC, sans-serif" font-weight="700" font-size="50" fill="#1E3C32">获取网站地址</text><text x="94" y="224" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="23" fill="#587166">部署成功即可分享学术主页</text><rect x="86" y="267" width="928" height="272" rx="18" fill="#FFFFFF" opacity=".9"/><circle cx="132" cy="316" r="19" fill="#245846"/><text x="132" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">1</text><text x="179" y="324" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="24" fill="#24453B">回到 Settings → Pages</text><circle cx="132" cy="376" r="19" fill="#245846"/><text x="132" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">2</text><text x="179" y="384" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="24" fill="#24453B">找到 Visit site（访问网站）</text><circle cx="132" cy="436" r="19" fill="#245846"/><text x="132" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">3</text><text x="179" y="444" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="24" fill="#24453B">复制专属 GitHub Pages 网址</text><circle cx="132" cy="496" r="19" fill="#245846"/><text x="132" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">4</text><text x="179" y="504" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="24" fill="#24453B">将网址加入简历、邮件或学术资料</text><text x="92" y="577" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="17" fill