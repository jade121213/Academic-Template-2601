<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630"><rect width="1100" height="630" rx="28" fill="#F7F8F5"/><rect x="34" y="34" width="1032" height="562" rx="24" fill="#DFE8F0"/><text x="92" y="108" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="22" fill="#557266">WISEROBOT STUDIO · 使用指南</text><text x="92" y="185" font-family="Arial, Noto Sans CJK SC, sans-serif" font-weight="700" font-size="50" fill="#1E3C32">开启 GitHub Pages</text><text x="94" y="224" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="23" fill="#587166">一次配置，以后提交就自动发布</text><rect x="86" y="267" width="928" height="272" rx="18" fill="#FFFFFF" opacity=".9"/><circle cx="132" cy="316" r="19" fill="#245846"/><text x="132" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">1</text><text x="179" y="324" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="24" fill="#24453B">进入仓库 Settings（设置）</text><circle cx="132" cy="376" r="19" fill="#245846"/><text x="132" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">2</text><text x="179" y="384" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="24" fill="#24453B">选择 Pages（页面）</text><circle cx="132" cy="436" r="19" fill="#245846"/><text x="132" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">3</text><text x="179" y="444" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="24" fill="#24453B">Source（来源）选 GitHub Actions</text><circle cx="132" cy="496" r="19" fill="#245846"/><text x="132" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">4</text><text x="179" y="504" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="24" fill="#24453B">进入 Actions，查看绿色成功标记</text><text x="92" y="577" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="17" fill="#557166">说明：图为操作示意，GitHub 界面以实际显示为准。</text></svg>