<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630"><rect width="1100" height="630" rx="28" fill="#F7F8F5"/><rect x="34" y="34" width="1032" height="562" rx="24" fill="#E5E4F0"/><text x="92" y="108" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="22" fill="#557266">WISEROBOT STUDIO · 使用指南</text><text x="92" y="185" font-family="Arial, Noto Sans CJK SC, sans-serif" font-weight="700" font-size="50" fill="#1E3C32">上传图片与论文</text><text x="94" y="224" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="23" fill="#587166">使用仓库文件存放展示素材</text><rect x="86" y="267" width="928" height="272" rx="18" fill="#FFFFFF" opacity=".9"/><circle cx="132" cy="316" r="19" fill="#245846"/><text x="132" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">1</text><text x="179" y="324" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="24" fill="#24453B">进入 assets/images 上传项目图片</text><circle cx="132" cy="376" r="19" fill="#245846"/><text x="132" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">2</text><text x="179" y="384" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="24" fill="#24453B">进入 assets 上传可公开的论文 PDF</text><circle cx="132" cy="436" r="19" fill="#245846"/><text x="132" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">3</text><text x="179" y="444" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="24" fill="#24453B">在 Markdown 中填写对应文件路径</text><circle cx="132" cy="496" r="19" fill="#245846"/><text x="132" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">4</text><text x="179" y="504" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="24" fill="#24453B">提交更改，等待网站自动更新</text><text x="92" y="577" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="17